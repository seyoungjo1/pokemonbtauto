# main 에 무언가 올라오면 업데이트 목록(manifest.json)을 다시 만든다 — 사용자 PC 의 '업데이트' 가 이것을 본다
name: 업데이트 목록 갱신

on:
  push:
    branches: [main]
    paths-ignore: ['manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: 셀프테스트 (데이터 · 데미지 · 팀 텍스트 · 변수 · 신경망)
        run: python tests/selftest.py data stats damage paste features net
      - name: manifest.json
        run: |
          python tools/make_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || (git commit -m "업데이트 목록 갱신" && git push origin main)
